[project]
name = "scriptorium"
version = "0.1.0"
description = "Private, CPU-only knowledge bases from digitised books: hybrid search, map, entity graph, style cards, MCP + Agent Skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "lancedb>=0.39.0",
    "markitdown[all]>=0.1.8",
    "mcp[cli]>=2.2.0",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pymupdf4llm>=1.28.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "yake>=0.7.3",
]

[project.scripts]
scriptorium = "scriptorium.cli:app"
scriptorium-mcp = "scriptorium.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]
